name: CLI release

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: invoicey-darwin-arm64
          - target: bun-darwin-x64
            asset: invoicey-darwin-x64
          - target: bun-linux-arm64
            asset: invoicey-linux-arm64
          - target: bun-linux-x64
            asset: invoicey-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Compile ${{ matrix.asset }}
        run: bun build --compile --target=${{ matrix.target }} --outfile=dist/${{ matrix.asset }} apps/cli/src/bin.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum invoicey-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/invoicey-*
            dist/SHA256SUMS
