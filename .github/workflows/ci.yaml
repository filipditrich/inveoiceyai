name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_STAGE: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invoicey
      BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
      INVOICEY_DEFAULT_WORKSPACE_ID: 00000000-0000-4000-8000-000000000001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Auth schema compatibility
        run: bun run --cwd apps/web check:auth-schema

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser and accessibility smoke
        run: bun run test:e2e
