<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Invoice lifecycle</title>
  <desc id="desc">Draft, issue, send, match, paid - with a human in the loop on issue and payment confirmation.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8F2"/>
      <stop offset="100%" stop-color="#F4E6D8"/>
    </linearGradient>
    <linearGradient id="copper2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4925A"/>
      <stop offset="100%" stop-color="#914522"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="28" fill="url(#bg2)"/>
  <rect x="1.5" y="1.5" width="1197" height="277" rx="26.5" fill="none" stroke="#E6D5C5" stroke-width="1.5"/>

  <text x="600" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="2.4" fill="#914522">FROM BRIEF TO PAID</text>

  <line x1="140" y1="128" x2="1060" y2="128" stroke="#E6D5C5" stroke-width="3"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <circle cx="140" cy="128" r="28" fill="#fff" stroke="#C4784A" stroke-width="3"/>
    <text x="140" y="134" font-size="16" font-weight="700" fill="#914522">1</text>
    <text x="140" y="186" font-size="16" font-weight="700" fill="#2A1810">Draft</text>
    <text x="140" y="208" font-size="12" fill="#6B5344">Web, JSON, or AI</text>

    <circle cx="370" cy="128" r="28" fill="#fff" stroke="#C4784A" stroke-width="3"/>
    <text x="370" y="134" font-size="16" font-weight="700" fill="#914522">2</text>
    <text x="370" y="186" font-size="16" font-weight="700" fill="#2A1810">Issue</text>
    <text x="370" y="208" font-size="12" fill="#6B5344">Number + snapshot</text>

    <circle cx="600" cy="128" r="28" fill="#fff" stroke="#C4784A" stroke-width="3"/>
    <text x="600" y="134" font-size="16" font-weight="700" fill="#914522">3</text>
    <text x="600" y="186" font-size="16" font-weight="700" fill="#2A1810">Send</text>
    <text x="600" y="208" font-size="12" fill="#6B5344">PDF + ISDOC email</text>

    <circle cx="830" cy="128" r="28" fill="#fff" stroke="#C4784A" stroke-width="3"/>
    <text x="830" y="134" font-size="16" font-weight="700" fill="#914522">4</text>
    <text x="830" y="186" font-size="16" font-weight="700" fill="#2A1810">Match</text>
    <text x="830" y="208" font-size="12" fill="#6B5344">Fio / MONETA proposal</text>

    <circle cx="1060" cy="128" r="28" fill="url(#copper2)"/>
    <text x="1060" y="134" font-size="16" font-weight="700" fill="#FFF8F2">5</text>
    <text x="1060" y="186" font-size="16" font-weight="700" fill="#2A1810">Paid</text>
    <text x="1060" y="208" font-size="12" fill="#6B5344">You confirm</text>
  </g>

  <text x="600" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6B5344">Issuing and payment confirmation stay human. The agent never invents a company ID.</text>
</svg>
